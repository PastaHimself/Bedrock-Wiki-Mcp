name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Semantic runtime dependency smoke test
        run: |
          node --input-type=module <<'NODE'
          await import('onnxruntime-node');
          const sharp = (await import('sharp')).default;
          if (!sharp.versions.vips) throw new Error('sharp/libvips failed to load');
          console.log(`sharp ${sharp.versions.sharp}; libvips ${sharp.versions.vips}`);
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate deployment artifacts
        run: |
          bash -n deploy/scripts/update-knowledge.sh
          bash -n deploy/scripts/bootstrap-ubuntu.sh
          bash -n deploy/scripts/verify-production.sh
          if [[ ! -x /usr/bin/node ]]; then
            sudo ln -s "$(command -v node)" /usr/bin/node
          fi
          systemd-analyze verify \
            deploy/systemd/bedrock-mcp.service \
            deploy/systemd/bedrock-mcp-update.service \
            deploy/systemd/bedrock-mcp-update.timer

      - name: Build
        run: npm run build

      - name: CLI smoke test
        run: |
          node dist/index.js version
          node dist/index.js help

  lexical-only-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install without semantic optional dependencies
        run: npm ci --omit=optional

      - name: Verify semantic packages are omitted
        run: |
          test ! -e node_modules/sqlite-vec
          test ! -e node_modules/@huggingface/transformers

      - name: Build without semantic optional dependencies
        run: npm run build

      - name: Lexical-only CLI smoke test
        run: |
          node dist/index.js version
          node dist/index.js help

  production-lexical-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build reproducible lexical-only application
        run: |
          npm ci --omit=optional
          npm run build

      - name: Prune to lexical production runtime
        run: |
          npm prune --omit=dev --omit=optional
          test ! -e node_modules/sqlite-vec
          test ! -e node_modules/@huggingface/transformers
          test ! -e node_modules/typescript
          test ! -e node_modules/vitest

      - name: Built lexical runtime smoke test
        run: |
          node dist/index.js version
          node dist/index.js help
