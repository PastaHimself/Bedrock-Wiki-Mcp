name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate deployment artifacts
        run: |
          bash -n deploy/scripts/update-knowledge.sh
          systemd-analyze verify \
            deploy/systemd/bedrock-mcp.service \
            deploy/systemd/bedrock-mcp-update.service \
            deploy/systemd/bedrock-mcp-update.timer

      - name: Build
        run: npm run build

      - name: CLI smoke test
        run: |
          node dist/index.js version
          node dist/index.js help
